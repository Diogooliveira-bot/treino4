name: Build Treino 4 APK

on:
  push:
    branches: [main]
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon -p android-apk :app:assembleDebug

      - name: Copy APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Treino4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Treino4-APK
          path: Treino4.apk

      - name: Publish APK in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Treino4.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged'
          else
            git commit -m 'Gera APK instalável do Treino 4'
            git push
          fi
